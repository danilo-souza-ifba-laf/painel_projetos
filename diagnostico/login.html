<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Diagnóstico dos Cursos | IFBA • PROEN</title>
    <link rel="stylesheet" href="css/style.css">
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
    <script defer src="js/config.js"></script>
    <script defer src="js/common.js"></script>
    <script defer src="js/login.js"></script>
</head>

<body>
    <header><a class="brand" href="login.html"><span class="brand-mark" aria-hidden="true">IF</span><span><strong>IFBA
                    <span class="divider">/</span> PROEN</strong><small>Pró-Reitoria de Ensino</small></span></a><button
            id="theme" class="quiet" aria-label="Alternar tema">◐ Tema</button></header>
    <main class="auth-layout with-art">
        <div class="mobile-art" role="img" aria-label="Novos currículos para novos futuros — Etapa de Diagnóstico">
        </div>
        <section class="card"><span class="eyebrow">DIAGNÓSTICO IFBA</span>
            <h2>Bem-vindo(a)</h2>
            <p class="muted">Entre com seu e-mail e senha cadastrados.</p>
            <div id="message" role="status" aria-live="polite" hidden></div>
            <form id="login-form"><label for="email">E-mail</label><input id="email" type="email"
                    autocomplete="username" required maxlength="254" placeholder="seu.email@ifba.edu.br"><label
                    for="password">Senha</label>
                <div class="password-wrap"><input id="password" type="password" autocomplete="current-password"
                        required><button type="button" data-password="password" aria-label="Mostrar senha"
                        aria-pressed="false">Mostrar</button></div><button class="primary" type="submit">Entrar no
                    sistema →</button>
            </form><button id="forgot" class="text-button">Esqueci minha senha</button>
            <div class="separator"></div>
            <p class="muted"><a href="solicitar-acesso.html">Primeiro acesso?</a></p>
        </section>
    </main>
    <footer><span>Instituto Federal da Bahia · Pró-Reitoria de Ensino</span><span>Diagnóstico dos Cursos · Desenvolvido
            por Danilo Santos Souza</span></footer>
</body>

</html>
